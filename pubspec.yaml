name: arls_za
description: "ARLS-ZA — Almost Real Life Survival: Zombie Apocalypse. Hyper-realistic GPS survival."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistence (design doc §11.1)
  drift: ^2.28.0
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1

  # Snapshot checksums (§11.1.3)
  crypto: ^3.0.6

  intl: any
  video_player: ^2.9.2
  geolocator: ^14.0.3
  battery_plus: ^7.1.1
  http: ^1.6.0
  maplibre_gl: ^0.26.2
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Drift code generation and migration tests (§11.1.4)
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  test: ^1.25.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # §12: the two faces the game is read in. Bundled, never fetched — the
    # game is offline-first, and a screen that waits on a font is a screen
    # that is blank in a field with no signal.
    #
    # IBM Plex, SIL Open Font License 1.1 (assets/fonts/OFL.txt). Chosen for
    # being a measuring instrument rather than a poster: it was drawn for
    # dashboards and it reads at arm's length in the rain.
    - family: Plex
      fonts:
        # One variable file carries every weight and every width, Condensed
        # included, for less than the two static faces it replaces.
        - asset: assets/fonts/IBMPlexSans-Variable.ttf

    # ⚠️ Numbers only. Every figure on the HUD sits in a column that must not
    # move as it changes — §3.6's bars are read at a glance while walking, and
    # a digit that shifts the ones beside it is a digit nobody can read. The
    # code already asks for tabular figures in a dozen places; a monospace is
    # that promise kept in the face itself.
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

  assets:
    - assets/icon.png
    - assets/INTRO.mp4
    - assets/regions.json
    - assets/data/
    # §12: grafika, jako WebP w dwóch rozmiarach. Zródła (images/, 66 MB
    # JPEG-ów) nigdy tu nie trafiają — tool/build_art.py robi z nich 1,7 MB.
    - assets/images/items/weapons/
    - assets/images/items/armors/
    - assets/images/items/boots/
    - assets/images/items/pants/
    - assets/images/items/tools/
    - assets/images/lootplaces/
    - assets/images/shelter/
    - assets/images/skills/
    - assets/images/zombies/
