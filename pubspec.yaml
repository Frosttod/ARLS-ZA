name: arls_za
description: "ARLS-ZA — Almost Real Life Survival: Zombie Apocalypse. Hyper-realistic GPS survival."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistence (design doc §11.1)
  drift: ^2.28.0
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1

  # Snapshot checksums (§11.1.3)
  crypto: ^3.0.6

  intl: any
  video_player: ^2.9.2
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Drift code generation and migration tests (§11.1.4)
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  test: ^1.25.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon.png
    - assets/INTRO.mp4
