name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check generated code is up to date
        # A stale database.g.dart means the schema in the repository is not the
        # schema that ships. Regenerating here and diffing catches it.
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib || {
            echo "::error::Generated code is out of date. Run: dart run build_runner build && flutter gen-l10n"
            exit 1
          }

      - name: Test
        run: flutter test --reporter expanded

  schema:
    name: Schema is dumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Every schema version has a committed dump
        # Migrations are additive only (design doc §11.1.4) and the migration
        # tests read these files. A version bump without a dump means the next
        # release migrates blind.
        run: |
          dart run drift_dev schema dump lib/data/db/database.dart drift_schemas
          git diff --exit-code -- drift_schemas || {
            echo "::error::drift_schemas is out of date. Run: dart run drift_dev schema dump lib/data/db/database.dart drift_schemas"
            exit 1
          }

  build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        # Release builds need the keystore, which lives outside the repository
        # (PROCEDURA_RELEASE.md). CI proves the project compiles; signing and
        # publishing happen on a machine that holds the key.
        run: flutter build apk --debug

  devtools-stripped:
    name: Developer mode is stripped from release
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed with debug keys — this artifact is only ever inspected, never
      # published. What matters is that it went through the release compiler.
      - name: Build release APK
        run: flutter build apk --release

      - name: Release artifact must not contain devtools
        # The GPS simulator, the ×3600 time accelerator and the physiology
        # panel would make every balance figure and every survival streak
        # meaningless in players' hands (design doc §11.2).
        run: dart run tool/check_release_strip.dart build/app/outputs/flutter-apk/app-release.apk

      - name: The check itself must have teeth
        # Forcing devtools on has to make the previous step fail. Without this,
        # a check that silently stopped finding anything would look like a pass.
        run: |
          flutter build apk --release --dart-define=arls.devtools=true
          if dart run tool/check_release_strip.dart build/app/outputs/flutter-apk/app-release.apk; then
            echo "::error::The strip check passed on a build that contains devtools — the check is vacuous."
            exit 1
          fi
          echo "Strip check correctly rejects a devtools build."
